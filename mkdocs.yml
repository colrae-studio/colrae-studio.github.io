site_name: Colrae
site_url: https://colrae-studio.github.io/
site_description: Colrae makes small games for iPhone and iPad.
site_author: Colrae
repo_url: https://github.com/colrae-studio/colrae-studio.github.io
repo_name: colrae-studio
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: true
strict: true
not_in_nav: |
  404.md

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  font:
    text: Roboto Mono
    code: Roboto Mono
  icon:
    logo: colrae/mark
    repo: fontawesome/brands/github
  features:
    - search.suggest
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.indexes
    - toc.integrate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      scheme: colrae-light
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: colrae-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: colrae-dark
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

nav:
  - Home: index.md
  - Support: support.md
  - Thronefold:
      - thronefold/index.md
      - Privacy: thronefold/privacy.md
      - Support: thronefold/support.md
      - Credits: thronefold/credits.md

plugins:
  - privacy
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
