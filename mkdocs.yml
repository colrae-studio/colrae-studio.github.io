site_name: Colrae
site_url: https://colrae-studio.github.io/
site_description: Colrae makes small games for iPhone and iPad.
site_author: Colrae
docs_dir: docs
use_directory_urls: true
strict: true
not_in_nav: |
  404.md

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.svg
  font:
    text: Roboto Mono
    code: Roboto Mono
  icon:
    logo: colrae/mark
  features:
    - search.suggest
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.indexes
    - toc.integrate
  palette:
    - media: all
      scheme: colrae-dark
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: colrae-light
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  contact_url: https://docs.google.com/forms/d/e/1FAIpQLSf8AZvMNqCBW9ZPnAS4ouOjWDzg_SnRk5_XRJVObHSBjagQiA/viewform

hooks:
  - hooks/contact.py

nav:
  - Home: index.md
  - About: about.md
  - Support: support.md
  - Thronefold:
      - thronefold/index.md
      - Privacy: thronefold/privacy.md
      - Support: thronefold/support.md
      - Credits: thronefold/credits.md

plugins:
  - privacy
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
